[package]
name = "takt-cli"
version = "0.3.0"
edition = "2024"
description = "Command-line access to Takt's Checkvist lists, dailies, day log and workspace, and the MCP server the app bundles."
publish = false

[[bin]]
name = "takt"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
plist = "1.10.0"
ratatui = "0.30.2"
rpassword = "7.5.4"
rusqlite = "0.32"
serde_json = "1.0.151"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1.24.1", features = ["v4"] }

[profile.release]
strip = true
