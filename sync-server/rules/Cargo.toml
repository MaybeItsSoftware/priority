[package]
name = "takt-sync-rules"
version = "0.1.0"
edition = "2024"
publish = false
description = "The sync rules the server and every client share: the hybrid logical clock, the per-column merge and the bodies a sync cycle sends. See docs/sync.md."

# It lives inside sync-server/ because Railway builds the server from that
# directory alone; the Rust core (core/) reaches it by path from outside.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
