# Railway service configuration for the sync server.
#
# Set the service's **Root Directory to `sync-server`** in the dashboard, or
# Railway resolves the repo root, where there is no Dockerfile (the root is the
# macOS app), and fails or builds the wrong thing.
#
# Set the service variables:
#
#   DATABASE_URL=<the Supabase project's session pooler URL, port 5432>
#   SUPABASE_URL=https://<ref>.supabase.co
#   SUPABASE_SECRET_KEY=<the project's secret API key, for deleting accounts>
#
# DATABASE_URL and SUPABASE_URL are required; the server exits at boot
# without them. PORT is provided by Railway. Accounts are Supabase Auth users:
# people sign up in the apps with email, Google or Apple.
#
# No volume: every byte of state is in Postgres. Migrations run at boot.
# See docs/sync.md for the protocol and sync-server/README.md for running it.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Liveness only: answers without touching the database, so a slow Postgres
# does not get the container killed.
healthcheckPath = "/health"
healthcheckTimeout = 60

# All state is in Postgres, so a restart loses nothing. Restart on a crash,
# but stop if it is crash-looping (a bad DATABASE_URL, say).
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# One is plenty for one person's devices. More would also be safe: pushes are
# serialised by a Postgres advisory lock rather than anything in-process, and
# long-polls are woken through Postgres LISTEN/NOTIFY, so a push to one
# replica wakes a device waiting on another.
numReplicas = 1

# Never sleep. Devices hold a long-poll open on /v1/changes for up to 25 s at a
# time while the app is in front, and a sleeping service would drop those and
# make every first sync after a quiet spell wait on a cold start.
sleepApplication = false
