name: TaktMobile

# The iOS app. Generated with XcodeGen; the .xcodeproj is not committed.
#
#   cd mobile/ios && xcodegen
#
# The workspace logic is not re-implemented here: the app links the repo's own
# Swift package (`../..`) — TaktCore, TaktWorkspace and
# TaktWorkspaceEditing — exactly the libraries the Mac app uses.

options:
  bundleIdPrefix: uk.co.maybeitssoftware
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: 6NQNU5YSC2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  Takt:
    path: ../..

targets:
  TaktMobile:
    type: application
    platform: iOS
    sources:
      - path: TaktMobile
      - path: Shared
      - path: ../../Takt/Fonts
        group: Fonts
        buildPhase: resources
    dependencies:
      - package: Takt
        product: TaktCore
      - package: Takt
        product: TaktWorkspace
      - package: Takt
        product: TaktWorkspaceEditing
      - package: Takt
        product: TaktSync
      - target: TaktWidgets
        embed: true
    entitlements:
      path: TaktMobile/TaktMobile.entitlements
      properties:
        com.apple.security.application-groups:
          - group.uk.co.maybeitssoftware.takt
        # Sign in with Apple, natively, for sync accounts (Supabase).
        com.apple.developer.applesignin:
          - Default
    info:
      path: TaktMobile/Info.plist
      properties:
        CFBundleDisplayName: Takt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        # `takt://`: the widgets' links, and `takt://auth-callback`,
        # where Supabase's emails (confirming an address, resetting a
        # password) open the app.
        CFBundleURLTypes:
          - CFBundleURLName: uk.co.maybeitssoftware.takt
            CFBundleURLSchemes:
              - takt
        BGTaskSchedulerPermittedIdentifiers:
          - uk.co.maybeitssoftware.takt.sync
        UIBackgroundModes:
          - fetch
        UIAppFonts:
          - IBMPlexSans-Regular.ttf
          - IBMPlexSans-Medium.ttf
          - IBMPlexSans-SemiBold.ttf
          - IBMPlexSans-Bold.ttf
          - IBMPlexSans-Italic.ttf
          - Lilex-Regular.ttf
          - Lilex-Medium.ttf
          - Lilex-Bold.ttf
          - Inter-Regular.ttf
          - Inter-Italic.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - Geist-Regular.ttf
          - Geist-Italic.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
          - GeistMono-Bold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-Bold.ttf
          - Arvo-Regular.ttf
          - Arvo-Italic.ttf
          - Arvo-Bold.ttf
          - Arvo-BoldItalic.ttf
    settings:
      base:
        PRODUCT_NAME: Takt
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.maybeitssoftware.takt
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO

  TaktWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TaktWidgets
      - path: Shared
      - path: ../../Takt/Fonts
        group: WidgetFonts
        buildPhase: resources
        includes:
          - "*.ttf"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
    entitlements:
      path: TaktWidgets/TaktWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.uk.co.maybeitssoftware.takt
    info:
      path: TaktWidgets/Info.plist
      properties:
        CFBundleDisplayName: Takt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - IBMPlexSans-Regular.ttf
          - IBMPlexSans-Medium.ttf
          - IBMPlexSans-SemiBold.ttf
          - Lilex-Regular.ttf
          - Lilex-Medium.ttf
    settings:
      base:
        PRODUCT_NAME: TaktWidgets
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.maybeitssoftware.takt.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  TaktMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TaktMobileTests
    dependencies:
      - target: TaktMobile
      - package: Takt
        product: TaktWorkspace
      - package: Takt
        product: TaktCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.maybeitssoftware.takt.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Takt.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Takt
        BUNDLE_LOADER: $(TEST_HOST)

  # The widget views and the Live Activity's lock-screen view, rendered from
  # the extension's own sources (all but the @main bundle) and the shared
  # snapshot types. Hosted by the app so the bundled fonts are registered.
  TaktWidgetsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TaktWidgetsTests
      - path: Shared
      - path: TaktWidgets
        excludes:
          - TaktWidgetsBundle.swift
          - Info.plist
          - "*.entitlements"
    dependencies:
      - target: TaktMobile
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.maybeitssoftware.takt.widgettests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Takt.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Takt
        BUNDLE_LOADER: $(TEST_HOST)

  TaktMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TaktMobileUITests
    dependencies:
      - target: TaktMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.maybeitssoftware.takt.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TaktMobile

schemes:
  TaktMobile:
    build:
      targets:
        TaktMobile: all
        TaktWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TaktMobileTests
        - TaktWidgetsTests
        - TaktMobileUITests
    archive:
      config: Release
