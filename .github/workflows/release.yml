# Builds an UNSIGNED DMG when a `v*` tag is pushed and attaches it to the
# GitHub release. CI runners have no signing certificate (see docs/signing.md),
# so this artifact will not pass Gatekeeper on another Mac; it exists so a tag
# always has a reproducible, downloadable build next to it. The signed and
# notarised path — the one users should actually install from — is
# `scripts/build_dmg.sh <version>` run on a Mac that holds the Developer ID
# certificate.
name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      # The app build cargo-builds the `takt` CLI and bundles it as the MCP
      # server (scripts/bundle_cli.sh), so an xcodebuild here needs Rust.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: cargo-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock') }}

      - name: Resolve version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # MARKETING_VERSION comes from the tag and CURRENT_PROJECT_VERSION from
      # the commit count (fetch-depth: 0 above makes that count real), the same
      # way scripts/build_dmg.sh and scripts/build_app_store.sh set them, so
      # the bundle's Info.plist says what the release page says.
      #
      # CODE_SIGNING_ALLOWED=NO: the project signs Manual with an "Apple
      # Development" identity that no runner has; without this flag the build
      # fails looking for it (docs/signing.md).
      - name: Build release app
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          DERIVED_DIR="$RUNNER_TEMP/derived-release"
          xcodebuild -project 'Takt.xcodeproj' \
            -scheme 'Takt' \
            -configuration Release \
            -derivedDataPath "$DERIVED_DIR" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" \
            build

          APP_PATH="$DERIVED_DIR/Build/Products/Release/Takt.app"
          mkdir -p dist
          cp -R "$APP_PATH" "dist/Takt.app"

      # The MCP server is the bundled CLI. A DMG without it has a --mcp-server
      # that execs nothing, which breaks every MCP client configuration on the
      # user's machine — worth failing the release for.
      - name: Verify the bundled MCP server
        run: |
          HELPER="dist/Takt.app/Contents/Helpers/takt"
          if [ ! -x "$HELPER" ]; then
            echo "::error::Built app is missing the bundled CLI at $HELPER (was TAKT_SKIP_CLI_BUNDLE set?)"
            exit 1
          fi
          echo "Bundled MCP server present: $HELPER"

      - name: Package DMG
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          STAGE_DIR="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE_DIR"
          cp -R "dist/Takt.app" "$STAGE_DIR/"
          ln -s /Applications "$STAGE_DIR/Applications"

          DMG_PATH="dist/takt-v${VERSION}-unsigned.dmg"
          hdiutil create \
            -volname "Takt" \
            -srcfolder "$STAGE_DIR" \
            -format UDZO \
            "$DMG_PATH"

          shasum -a 256 "$DMG_PATH" > "${DMG_PATH}.sha256"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          append_body: true
          body: |
            Release assets generated by CI:
            - takt-v${{ steps.version.outputs.version }}-unsigned.dmg
            - takt-v${{ steps.version.outputs.version }}-unsigned.dmg.sha256

            **This DMG is unsigned and not notarised** — CI has no signing
            certificate, so Gatekeeper will block it on another Mac unless you
            right-click → Open or clear the quarantine attribute. The signed,
            notarised build comes from `scripts/build_dmg.sh` run on a Mac with
            the Developer ID certificate; see docs/signing.md.
          files: |
            dist/takt-v${{ steps.version.outputs.version }}-unsigned.dmg
            dist/takt-v${{ steps.version.outputs.version }}-unsigned.dmg.sha256
