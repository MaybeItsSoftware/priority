name: Tramline · Android

# Triggered by Tramline. Builds the signed bundle with
# scripts/build_play_bundle.sh (the same tests, lint and debug-key check as a
# local release and android-internal.yml), but with Tramline's versionCode and
# versionName, and uploads it as a single workflow artifact. Tramline uploads
# that artifact to Google Play itself, so no Play credentials are needed here.

on:
  workflow_dispatch:
    inputs:
      tramline-input:
        description: "JSON from Tramline (version_name, version_code, commit_ref, build_notes)"
        required: false
        default: "{}"

permissions:
  contents: read

concurrency:
  group: tramline-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Configure Tramline
        id: tramline
        uses: tramlinehq/deploy-action@v0.1.7
        with:
          input: ${{ github.event.inputs.tramline-input }}

      - name: Require Tramline version
        env:
          VERSION_NAME: ${{ steps.tramline.outputs.version_name }}
          VERSION_CODE: ${{ steps.tramline.outputs.version_code }}
        run: |
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::No version_name/version_code in tramline-input — this workflow is meant to be triggered by Tramline."; exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Gradle runs scripts/build_core_android.sh before preBuild: cargo-ndk
      # cross-compiles the Rust core (core/) for each ABI against the NDK.
      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          cache-bin: true

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install --locked cargo-ndk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Without keystore.properties the release build falls back to the debug
      # key, so refuse to go on without every signing secret.
      - name: Write keystore.properties
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::secret $name is not set"; exit 1; fi
          done
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # build_play_bundle.sh fails if the bundle comes out debug-signed.
      - name: Build signed bundle
        env:
          # Optional: without it the build hides the Google sign-in button.
          TAKT_GOOGLE_WEB_CLIENT_ID: ${{ secrets.TAKT_GOOGLE_WEB_CLIENT_ID }}
          VERSION_NAME: ${{ steps.tramline.outputs.version_name }}
          TAKT_VERSION_CODE: ${{ steps.tramline.outputs.version_code }}
        run: |
          ./scripts/build_play_bundle.sh "$VERSION_NAME"
          echo "AAB=build/play/takt-$VERSION_NAME-$TAKT_VERSION_CODE.aab" >> "$GITHUB_ENV"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: takt-android-${{ steps.tramline.outputs.version_name }}-${{ steps.tramline.outputs.version_code }}
          path: ${{ env.AAB }}
          retention-days: 7
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        working-directory: mobile/android
        run: rm -f upload-keystore.jks keystore.properties
