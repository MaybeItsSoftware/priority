name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "release/**"

jobs:
  swift-tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      # Package.swift's `takt_coreFFI` binary target is built, not committed:
      # the Rust core has to exist before the package can even resolve.
      - name: Build the Rust core
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          scripts/build_core_apple.sh

      - name: Build package
        run: swift build

      - name: Run swift tests with coverage
        run: swift test --enable-code-coverage

      # The previous step ran with --enable-code-coverage, so a missing
      # profile or bundle here means the report is silently absent, not that
      # coverage is optional. Fail the step rather than print a warning nobody
      # reads in a green run.
      - name: Report code coverage
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          XCTEST_PATH=$(find "${BIN_PATH}" -name '*.xctest' -type d | head -1)
          if [ -z "$XCTEST_PATH" ]; then
            echo "::error::No .xctest bundle under ${BIN_PATH} — coverage report cannot run."
            exit 1
          fi
          EXECUTABLE="${XCTEST_PATH}/Contents/MacOS/$(basename "${XCTEST_PATH}" .xctest)"
          COV_DIR=$(dirname "${BIN_PATH}")/codecov
          PROFDATA=$(find "${COV_DIR}" -name 'default.profdata' 2>/dev/null | head -1)
          if [ -z "$PROFDATA" ]; then
            echo "::error::No default.profdata under ${COV_DIR} — swift test ran without producing coverage."
            exit 1
          fi
          xcrun llvm-cov report "${EXECUTABLE}" -instr-profile="${PROFDATA}" \
            -ignore-filename-regex='(Tests|\.build)'

  # `.swiftlint.yml` sets a 1,500-line file-length *error* and a handful of
  # length/complexity *warnings*. Deliberately not `--strict`: SwiftLint exits
  # non-zero on errors only, so an oversize file blocks the merge while the
  # remaining warnings — all type/function/file length or complexity on the
  # known large files — stay advisory. Their count and the list of files is
  # tracked in TODO.md, the single place that number lives; don't add to it.
  lint:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --reporter github-actions-logging

  macos-build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      # The app build now cargo-builds the `takt` CLI and bundles it as the
      # MCP server (scripts/bundle_cli.sh), so an xcodebuild here needs Rust.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
            core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock', 'core/Cargo.lock') }}

      # Package.swift's `takt_coreFFI` binary target is built, not committed:
      # the Rust core has to exist before the package can even resolve.
      - name: Build the Rust core
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          scripts/build_core_apple.sh

      # Both configurations now sign with a real "Apple Development" identity so
      # local rebuilds keep a stable designated requirement (and stop
      # re-prompting for keychain access). CI runners have no such certificate
      # in their keychain, so signing has to be off here.
      - name: Build app (Debug)
        run: |
          xcodebuild -project 'Takt.xcodeproj' \
            -scheme 'Takt' \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Release is the configuration that actually ships (scripts/build_dmg.sh)
      # and, unlike Debug, it enables the app sandbox with a different
      # entitlements file. Building only Debug meant sandbox-only breakage —
      # e.g. a missing entitlement for the OAuth loopback listener — reached
      # users without ever failing CI.
      - name: Build app (Release)
        run: |
          xcodebuild -project 'Takt.xcodeproj' \
            -scheme 'Takt' \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Guards the entitlements the app depends on at runtime, which a compile
      # alone cannot check.
      #
      # The sandbox is deliberately OFF and this asserts that it stays off.
      # Under the sandbox, keychain access is scoped to an access group that
      # comes from `com.apple.application-identifier`, which only an embedded
      # provisioning profile grants — and the project signs manually with none.
      # The sandboxed build therefore had no access group, every `SecItemAdd`
      # failed, and the app silently forgot the Checkvist remote key on every
      # relaunch. Turning it back on means provisioning a profile and adding
      # `keychain-access-groups` first; see the entitlements file.
      - name: Verify release entitlements
        run: |
          ENTITLEMENTS='Takt/Takt.release.entitlements'
          read_key() {
            /usr/libexec/PlistBuddy -c "Print :$1" "$ENTITLEMENTS" 2>/dev/null || echo missing
          }

          sandbox=$(read_key com.apple.security.app-sandbox)
          if [ "$sandbox" != "false" ]; then
            echo "::error::$ENTITLEMENTS re-enables the app sandbox (got: $sandbox)."
            echo "::error::That breaks keychain access without a provisioning profile."
            exit 1
          fi

          # The build setting is what actually decides this — an earlier attempt
          # to unsandbox by editing the plist alone changed nothing, because
          # Xcode synthesises entitlements from ENABLE_APP_SANDBOX.
          if grep -q 'ENABLE_APP_SANDBOX = YES' 'Takt.xcodeproj/project.pbxproj'; then
            echo "::error::ENABLE_APP_SANDBOX is YES in project.pbxproj, which overrides the plist."
            exit 1
          fi

          # Kept true so that re-enabling the sandbox one day doesn't silently
          # drop capabilities the app needs — notably the OAuth loopback
          # listener, which `GoogleOAuthLoopbackReceiver` cannot bind without
          # network.server.
          for key in \
            com.apple.security.network.client \
            com.apple.security.network.server \
            com.apple.security.files.user-selected.read-write
          do
            value=$(read_key "$key")
            if [ "$value" != "true" ]; then
              echo "::error::$ENTITLEMENTS is missing or disables $key (got: $value)"
              exit 1
            fi
          done
          echo "Release entitlements OK"

  # The CLI is a separate cargo crate sharing no code with the Swift targets, so
  # it gets its own job. It is also now the *only* MCP server — the app bundles
  # it and `--mcp-server` hands over to it — so these tests are what hold the
  # server itself correct. `mcp-smoke` below checks the handover.
  # The shared Rust core (core/, docs/rust-core-migration.md).
  core:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: core-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --manifest-path core/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path core/Cargo.toml

  cli:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: cargo-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --manifest-path cli/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path cli/Cargo.toml

  # The app no longer implements MCP itself: it bundles the `takt` CLI at
  # Contents/Helpers/takt and `--mcp-server` execs it. This checks the seam,
  # and specifically that a client configuration written *before* that change —
  # naming `Priority --mcp-server`, with credentials in `env` — still reaches a
  # working server. Nothing else covers that promise. Reads no real data and
  # needs no credentials.
  mcp-smoke:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
            core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock', 'core/Cargo.lock') }}

      # Package.swift's `takt_coreFFI` binary target is built, not committed:
      # the Rust core has to exist before the package can even resolve.
      - name: Build the Rust core
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          scripts/build_core_apple.sh

      # The build phase runs scripts/bundle_cli.sh, which cargo-builds the CLI
      # and installs it into the bundle, so this covers the bundling too.
      - name: Build app (Debug)
        run: |
          xcodebuild -project 'Takt.xcodeproj' \
            -scheme 'Takt' \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check the --mcp-server handover
        run: python3 scripts/mcp_smoke_check.py
