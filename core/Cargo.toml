[package]
name = "takt-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "Takt's shared core: the workspace store, its journal and sync, called by every client through UniFFI. See docs/rust-core-migration.md."

[lib]
# `lib` for the CLI and sync server, which link it as a Rust crate; `staticlib`
# for the Apple xcframework; `cdylib` for Android and for the JVM unit tests,
# and as the library UniFFI's bindgen reads its metadata from.
crate-type = ["lib", "staticlib", "cdylib"]
name = "takt_core"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = "0.32"
# The clock and merge the sync server uses, so a stamp is made one way
# everywhere. It sits inside sync-server/ because Railway builds the server
# from that directory alone.
takt-sync-rules = { path = "../sync-server/rules" }
chrono = "0.4"
chrono-tz = "0.10"
regex-lite = "0.1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

# The core never brings a second SQLite into an app: two copies in one
# process can each release the other's POSIX locks on a shared file and
# corrupt it. Apple platforms link the system SQLite, which GRDB uses too.
# Android links androidx's bundled SQLite (libsqliteJni.so), which the app's
# driver already loads; scripts/build_core_android.sh points the build at it.
# Anywhere else (a Linux host, CI) bundles one, with FTS5 for v7.
[target.'cfg(any(target_vendor = "apple", target_os = "android"))'.dependencies]
rusqlite = "0.32"

[target.'cfg(not(any(target_vendor = "apple", target_os = "android")))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
