[package]
name = "takt-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "Takt's shared core: the workspace store, its journal and sync, called by every client through UniFFI. See docs/rust-core-migration.md."

[lib]
# `lib` for the CLI and sync server, which link it as a Rust crate; `staticlib`
# for the Apple xcframework; `cdylib` for Android and for the JVM unit tests,
# and as the library UniFFI's bindgen reads its metadata from.
crate-type = ["lib", "staticlib", "cdylib"]
name = "takt_core"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = "0.32"
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

# Apple platforms link the system SQLite, the same library GRDB uses in the
# apps: two SQLite copies in one process can each release the other's POSIX
# locks on a shared file and corrupt it. Android has no system SQLite an app
# may link, so the core brings its own there (with FTS5, which v7 needs).
[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = "0.32"

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
